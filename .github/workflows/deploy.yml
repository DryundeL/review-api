name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-api-${{ github.ref }}
  # Superseded PR runs are useless; never interrupt a production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dryundel/review-api

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and static analysis
        run: |
          files=$(gofmt -l cmd internal migrations)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
          go vet ./...
      - name: Test
        run: go test -race ./...

  # Runs in parallel with the tests; deploy waits for both.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Unchanged layers (the Alpine base) are already in the registry.
          docker push --quiet "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Read-only token: the server receives it only to pull this release.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/deploy.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$work/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$work/known_hosts"

          # Small config bundle (a few KB); the image is pulled from GHCR.
          mkdir -p "$work/release/deploy"
          cp compose.yaml deploy/pull.sh deploy/activate.sh "$work/release/"
          cp deploy/redis-entrypoint.sh "$work/release/deploy/"
          printf '%s\n' "$GITHUB_SHA" > "$work/release/.release-version"
          printf '%s\n' "$GITHUB_ACTOR" > "$work/release/.registry-user"
          printf '%s' "$REGISTRY_TOKEN" > "$work/release/.registry-token"
          tar -czf "$work/release.tar.gz" -C "$work/release" .

          # One SSH session: unpack the bundle into a private directory and activate.
          incoming=/home/wapp/.local/share/review-api/incoming
          remote=$(printf 'set -eu; umask 077; mkdir -p %s; d=$(mktemp -d %s/%s.XXXXXX); trap '"'"'rm -rf "$d"'"'"' EXIT; tar -xzf - -C "$d"; sh "$d/activate.sh" %s "$d" </dev/null' \
            "$incoming" "$incoming" "$GITHUB_SHA" "$GITHUB_SHA")
          ssh -i "$work/key" -o "UserKnownHostsFile=$work/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            wapp@194.146.223.221 "$remote" < "$work/release.tar.gz"
