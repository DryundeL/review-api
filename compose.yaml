name: review-api

x-app: &app
  image: review-api:${APP_VERSION:-local}
  build: .
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=16m,mode=1777
  env_file:
    - ${APP_ENV_FILE:-.env}
  environment:
    # Docker network addresses override local addresses in .env.
    DB_HOST: postgres
    REDIS_HOST: redis
    # The tested release SHA is supplied by the deployment script.
    APP_VERSION: ${APP_VERSION:-local}
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null "http://127.0.0.1:$$APP_PORT/readyz"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    command: [/app/worker]
    depends_on:
      app:
        condition: service_healthy

  bot:
    <<: *app
    command: [/app/bot]
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      app:
        condition: service_healthy

  migrator:
    <<: *app
    restart: "no"
    profiles: [tools]
    command: [/app/migrator, -command=up]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    command: [postgres, -p, "${DB_PORT:-5432}"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      PGPORT: ${DB_PORT:-5432}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: redis
    command: [sh, /usr/local/bin/review-redis-start.sh]
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
      - ./deploy/redis-entrypoint.sh:/usr/local/bin/review-redis-start.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli -p "$$REDIS_PORT" --user "$${REDIS_USER:-default}" ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

volumes:
  postgres-data:
  redis-data:
